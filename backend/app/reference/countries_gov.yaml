# Справочник стран режима «Гос» (РЕШ-241, РЕШ-259, РЕШ-260).
#
# РЕДАКЦИЯ НА УТВЕРЖДЕНИЕ ВЛАДЕЛЬЦУ В PR. Состав перечня составлен по памяти
# о распоряжении Правительства РФ от 5 марта 2022 г. № 430-р и его изменениях,
# без сверки с текстом: сеть при составлении не использовалась. Перед слиянием
# сверить с publication.pravo.gov.ru (актуальная редакция, поздние добавления
# и исключения) и выставить `verified_against_source: true`.
#
# Коды стран — ISO 3166-1 alpha-2 СТРОКАМИ В КАВЫЧКАХ: без кавычек YAML читает
# `NO` (Норвегия) как булево `false` (инвариант №10). Загрузчик отвергает любое
# нестроковое значение кода.

source_url: "http://publication.pravo.gov.ru/"
source_title: "Распоряжение Правительства РФ от 05.03.2022 № 430-р (с изменениями)"
edition: "не подтверждена: сверить с актуальной редакцией на publication.pravo.gov.ru"
checked_at: "2026-10-17"
verified_against_source: false

