# Проверка обезличенности (`anonymize.py`) принимает латинские имена в стиле
# CamelCase за названия компаний. Имена из этого списка риском не считаются.
# Сравнение — точное, без учёта регистра, по всему совпадению: «TensorFlowLabs»
# в список не входит и остаётся риском. Новое имя добавляется правкой этого
# файла, без кода. Одно имя — одна запись, без пробелов; повторов быть не
# должно (регистр при сравнении не различается). Названия компаний сюда не
# вносятся.

