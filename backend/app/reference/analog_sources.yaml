# Белый список доменов поиска аналогов (Э6-2в, РЕШ-255, РЕШ-256, РЕШ-257).
#
# Яндекс-поиск формулировки `analog` сужается оператором `site:` до этих доменов
# (`search/analog_sources.py`). Домен добавляется или убирается правкой этого
# файла, без кода. Домен — только имя узла: без схемы, пути и пробелов, строчными
# буквами, без повторов. Значение `checked_at` — в кавычках, иначе YAML прочтёт
# дату как объект даты (инвариант №10).
#
# СОСТАВ НА УТВЕРЖДЕНИЕ ВЛАДЕЛЬЦУ В PR. Список составлен исполнителем по
# собственному суждению (РЕШ-275): организации, которые публикуют отраслевые
# обзоры, отчёты о технологиях и разбор внедрений. Отклик каждого домена
# проверен живым запросом из облачной среды 21.10.2026
# (`.planning/evidence/Э6-W3-Э6-2в-domains.txt`); коды 403 у части сайтов — это
# защита от роботов, домен при этом отвечает.

checked_at: "2026-10-21"

