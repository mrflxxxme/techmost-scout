cycle_2:
  review: .planning/evidence/Э5-И7-review.md (коммит e6ca95e), вердикт ВЕРНУТЬ,
    цикл 1 из 2, одна блокирующая находка
  finding: >
    Раздел 2 предлагал git clone https://github.com/... без аутентификации,
    а репозиторий github.com/mrflxxxme/techmost-scout приватный
    (docs/remote-setup.md:21, подтверждено ревьюером запросом к GitHub API).
    Первая же исполняемая команда инструкции отказала бы: неаутентифицированный
    запрос к приватному репозиторию GitHub отвечает как на несуществующий, а
    логин/пароль GitHub не принимает с 2021 года. Ни раздел 1 «Что нужно
    заранее», ни какой-либо другой документ репозитория (docs/remote-setup.md,
    .planning/DECISIONS.md) шага доступа к самому коду не содержал.
  fix:
    - "Раздел 1: добавлен пункт «Доступ к репозиторию» (репозиторий приватный,
      способ описан в разделе 2) и пункт про доустановку git на минимальных
      образах VPS (apt-get install -y git) — совет ревьюера."
    - "Раздел 2 переписан: способ 1 (рекомендуется) — SSH deploy-ключ только на
      чтение: генерация ssh-keygen на сервере, добавление публичной части в
      GitHub Settings → Deploy keys без права записи, клонирование по SSH и
      закрепление ключа через git config core.sshCommand (чтобы git pull в
      разделе 8 работал без доп. флагов). Способ 2 — personal access token
      (fine-grained, Contents: Read-only) в URL клонирования, с той же
      оговоркой про историю оболочки, что и для пароля Caddy (раздел 4), плюс
      предупреждение, что токен остаётся в .git/config, и как его убрать
      оттуда при отзыве."
    - "Раздел 8: явно подтверждено, что git pull работает тем же способом,
      каким сделан клон, без дополнительных шагов для обоих способов."
    - "Раздел 7 (совет ревьюера): формулировка про ответ Caddy сделана
      нейтральной — убрана привязка к HTTP/2, зависящая от согласования ALPN;
      указан код ответа (401/200) без версии протокола."
