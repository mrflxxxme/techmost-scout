    Решение по нормализации сравнения (критерий 1): сравниваю по `str.strip()`
    — убираю пробелы и пустые строки только по краям текста целиком, внутренние
    переносы строк и пробелы не трогаю. Обоснование в докстроке
    normalize_summary_text: задача явно ограничивает нормализацию краями
    («лишние пробелы и пустые строки по краям не считаются правкой»), а более
    агрессивная нормализация (схлопывание пробелов внутри текста) рискует
    счесть неправкой то, что эксперт изменил осознанно — например, перенос
    строки внутри рекомендации.

    Оговорки правятся как поле целиком (список), а не построчно: если хотя бы
    одна строка оговорок отличается от исходной после нормализации — всё поле
    caveats считается правкой и сохраняется целиком (как и раньше, РЕШ-206
    прямо требует замену списка целиком, частичного слияния текста нет).

    tests/test_web_review.py вырос с 469 до 498 строк — под пределом 500, но
    вплотную: для этого пришлось объединить три критерия (1, 3, 4) в один тест
