    Новые клиентские фразы этой задачи — на визу владельца (РЕШ-143 п.7):
    1. «Бриф ещё не подтверждён. Вернитесь к шагу подтверждения и нажмите
       «Подтвердить и продолжить».» — отказ старта без подтверждённого брифа.
    2. «Сейчас выполняется другой запрос (№{other_id}). Дождитесь его
       завершения и запустите этот запрос заново.» — отказ замка РЕШ-147.
    3. «Запрос №{id} не найден.» — защитный ответ на несуществующий id
       (не в списке критериев, добавлено для устойчивости маршрута).
    4. «Прогон прерван перезапуском. Фоновая задача не пережила перезапуск
       сервиса — сам запрос и бриф сохранены.» + кнопка «Запустить заново» —
       плашка на хабе и в списке запросов (history.html).
    5. «Прогон завершился отказом.» + кнопка «Запустить заново» — блок хаба
       при статусе failed.
    6. «Бриф подтверждён и готов к поиску.» + кнопка «Начать поиск» —
       переиспользует уже одобренный текст кнопки из постановки И-10/РЕШ-190
       п.3 («Начать поиск»), сама фраза-подводка новая.
    7. «Черновик отчёта готов. Стоимость запроса: N ₽» + «Открыть отчёт» —
       блок хаба при готовом отчёте.
    8. «Идёт поиск» — заголовок фрагмента прогресса.

