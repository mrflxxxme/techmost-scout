handoff:
  from: implementer-2
  to: reviewer
  task: "И-11"
  cycle: 2
  did:
    - "Цикл 2 (правки по ревью): БЛОКИРУЮЩЕЕ 1 — гонка двойного клика (РЕШ-147). Критическая секция «проверить замок и занять его» в start_run обёрнута в module-level asyncio.Lock (_start_lock): проверка реестра, чтение брифа, простановка статуса searching и регистрация задачи теперь идут одним атомарным блоком, второй конкурентный запрос блокируется на входе в async with и видит уже зарегистрированную задачу первого, а не пустой реестр"
    - "БЛОКИРУЮЩЕЕ 2 — request_hub на несуществующий id теперь отдаёт HTML через _notice (как и start_run), а не HTTPException(404), уходивший голым JSON application/json в обход response_class=HTMLResponse"
    - "Совет 1 — тексты «Запрос №N не найден» сведены к одной константе REQUEST_NOT_FOUND, используется в start_run и request_hub"
    - "Совет 2 — при отказе пайплайна без единого события хука (исключение до первого вызова progress) финальное событие в брокер честно говорит «Прогон завершился отказом.» вместо нейтрального «Прогон завершён.»"
    - "Совет 3 (стык И-9/И-10/И-11, повторное сохранение брифа после подтверждения) сознательно не тронут — не в границах файлов этой задачи, оставлен на аудит/И-13, как и написано в решении оркестратора"
    - "Новые тесты: два конкурентных сценария (двойной клик на один request_id — пайплайн запущен ровно 1 раз; два разных запроса одновременно — активным остаётся ровно один, второй отказывает 409) с искусственной задержкой внутри brief_store.load_brief, чтобы гарантированно попасть в окно гонки, а не полагаться на удачное совпадение по времени; тест на HTML-ответ хаба для несуществующего id"
    - "Мутационная проверка сделана вручную: временный откат async with _start_lock к прежнему коду — оба конкурентных теста красные (2 из 2 пайплайнов вместо 1, 200/200 вместо 200/409), после отката к исправлению — снова зелёные (diff с бэкапом пуст)"
    - "Добавлена фикстура _fresh_start_lock в тестах: asyncio.Lock привязывается к циклу событий первого использования, а у pytest-asyncio цикл свой на каждый тест — без пересоздания лока между тестами второй тест падает RuntimeError; сам продакшен-код это не затрагивает (один процесс — один цикл событий на весь его срок жизни)"
