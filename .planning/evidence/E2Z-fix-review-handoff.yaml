  notes: |
    Блокирующих находок нет, цикл 1 закрыт вердиктом ПРИНЯТЬ. Один существенный
    момент для внимания владельца на контрольном платном прогоне (РЕШ-181 п. 2,
    ещё не выполнен - явно оставлен исполнителем владельцу): у
    requirement_checks.status нет код-бэкстопа по образцу
    _MATURITY_UNCONFIRMED_MARKER, поэтому если правило 19 card_author где-то не
    сработает, verifier честно понизит confidence и добавит запись в
    unsourced_claims, но сама строка "<требование>: подтверждено источником" в
    блоке "Сверка с требованиями задачи" отчёта не изменится - рядом появится
    предупреждение, но не исправление. Рекомендация: на контрольном прогоне
    отдельно сверить именно этот блок по карточкам-патентам, не только
    essence/applicability. Это не блокирует данный цикл (правка cards.py вне
    визы РЕШ-181 п. 1), но стоит зафиксировать как критерий разбора
    контрольного прогона.

    Совет 2 аудита ("добор после склейки закрыт частично") при личной проверке
    оказался закрыт куда шире заявленного в notes исполнителя - это не
    претензия, это уточнение для следующего чтения handoff.
