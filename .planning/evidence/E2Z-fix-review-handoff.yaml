  read_first:
    - .planning/evidence/E2Z-fix-review.md (вердикт и разбор по пунктам, включая §4/§6)
    - .planning/evidence/audit-Э2-З.md (исходное блокирующее Б-1)
    - .planning/DECISIONS.md (РЕШ-181)
