  notes: |
    Автономные решения.
    1. Файл вне списка из четырёх: backend/app/web/scan_scrub.py (по разрешению постановки — вынесена вычистка контактов; scan_view.py остался 233 строки). CONTACT_HIDDEN и scrub_contacts теперь живут в scan_scrub; из scan_view импортируются scrub_contacts/scrub_url, CONTACT_HIDDEN из scan_view больше не экспортируется (Э6-6в: брать из scan_scrub, а JSON — только через scan_payload/build_scan_view).
    2. Телефон скрывается только при явном признаке: код в скобках; «+» с кодом страны и 10–15 цифрами; 7/8 в начале с кодом оператора и группировкой; группировка 3-3-2-2 с пробелами/дефисами (слева не цифра и не «цифра+пробел», чтобы хвост большой суммы не сошёл за телефон); ровно 10 цифр подряд, начинающихся на 3/4/8/9; «123-45-67» с дефисами. Не скрываются: годы и диапазоны («2019–2024», «2019 2020 2021»), суммы («12 000 000 ₽», «1 234 567», «+12 000 000 руб»), проценты, ГОСТ, RU 2 345 678, ИНН на 7/5…, 10 цифр на 5/6/7/1/2/0. Если форма неотличима от суммы и явного признака нет (например, «123 45 67» с пробелами, 10 цифр на 1/2/5/6/7) — НЕ скрывается (безопасная сторона скрытия применена только к формам с признаком). Известный побочный эффект: 10-значный ИНН/любое число из 10 цифр на 3/4/8/9 без разделителей и «8 100 200 30 40» будут скрыты (ложное срабатывание в безопасную сторону).
    3. URL: выбрана очистка ссылки модели, а не подмена ссылкой кандидата. Обоснование: обе указывают на одну страницу (сверка идёт по normalize_url), а часть источников (патентный реестр Беларуси ncip.by) держит номер документа в query — полное отбрасывание query ломает ссылку. Поэтому query чистится по параметрам. Если владелец предпочтёт «query всегда прочь», это одна строка в scrub_url (pairs = []).
    4. developer_org и gov_support.instrument по-прежнему не сверяются по числам (совет 2): организация берётся из источника, инструмент — из справочника господдержки; решение записано в докстроке card_verified. Контакты в обоих полях вычищаются (тест).
    5. Знак минус: только дефис/U+2212/U+2010/U+2011; «–» (en dash) остаётся диапазоном, не знаком. «10 -20» (пробел перед дефисом, без пробела после) читается как отрицательное число — в безопасную сторону (факт не подтвердится).
    Не делалось по постановке: имена лиц и почтовые/физические адреса в прозе не вычищаются (решение владельца: пункт в промпте писателя карточек или правило допустимого); совет 5 (кириллические домены: punycode в Evidence.url против исходной записи в candidates — .рф-источники выпадают из скана, безопасно) — отдельной задачей.
