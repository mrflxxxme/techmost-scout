handoff:
  from: implementer-c
  to: reviewer
  task: "Э6-6б (починка по ревью цикла 1)"
  did:
    - "Блокирующее 1 (телефоны, РЕШ-264): вычистка вынесена в новый модуль backend/app/web/scan_scrub.py. Тире U+2010–2015, U+2212 и неразрывные/тонкие пробелы сводятся к обычным заменой «знак на знак» — позиции совпадают, вычищается исходный текст. Покрыты все формы из отчёта (8 (495) 123–45–67; +7‑495‑123‑45‑67; 8 (800) 100‑12‑34; +7 (495) 123–45–67 без хвоста; 495 123 45 67; 495-123-45-67; (495) 123-45-67; 4951234567) плюс 84951234567, 8-800-555-35-35, 123–45–67, форма с U+00A0."
    - "Блокирующее 2 (инв. 1): title карточки и title аналога сверяются по числам источников (autoverify.card_verified/analog_verified). Названия моделей вида «МФ-300» проходят, если 300 есть в источнике."
    - "Блокирующее 3 (мутации): параметризованный тест «контакт в каждом печатаемом поле» (13 полей × 4 вида контакта) проверяет и scan_payload, и repr(view); тесты чисел essence/business_model/traction/transferability_ru/title аналога. Все 8 выживших мутаций (M9, M9b, M15, M18, M22, M24, M25, M26) убиты; ещё 30+ мутаций по одной — вывод в Э6-W3-Э6-6б-fix-checks.txt."
    - "Совет 1 (контакты в URL, сделано как блокирующее): scrub_url убирает логин/пароль, фрагмент, параметры запроса с контактом в имени (mail, tel, phone, …) или в значении; сегмент пути с контактом заменяется на «_»; не http/https (mailto:, tel:, javascript:) → пустая строка. Применяется к evidence.url, gov_support.url, country_evidence_url."
    - "Совет 3 (знак минус): numbers_in сохраняет знак (U+2212, дефис и U+2010/2011 вплотную к числу, не внутри слова и не в диапазоне): «−40 °C» не сверяется по «до 40 °C»."
    - "Совет 6: scan_payload повторно чистит готовый словарь (строки — scrub_contacts, ключи *_url — scrub_url), поэтому вид, собранный руками, контакты в JSON не пропускает; тест на ручной ScanView."
    - "Совет 8: поля источника в source_texts и склеенные дубли соединяются « | » — «12» в конце названия и «345» в начале сниппета не дают 12345."
