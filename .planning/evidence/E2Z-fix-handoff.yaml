    до target, как и было раньше — постановка (РЕШ-181 п. 4, совет аудита)
    говорит только про судью, лексический порог не трогал.

    За границами задачи замечено, не правил: совет 2 аудита ("удачная
    склейка уменьшает выдачу без добора") этим циклом закрыт лишь частично —
    добор нового кандидата на освободившееся место происходит только когда
    склейка привела число заготовок к ≤ target или ниже; если после склейки
    заготовок всё ещё больше target, cut_to_target по-прежнему берёт только
    первые target лучших, а кандидат, вытесненный склейкой на 7-е место,
    в очередной раз не поднимается явным "добором" — это тот же эффект,
    просто честно перенесённый на новую точку среза, а не новая функция
    добора. Отдельная задача, если владелец сочтёт нужным.
