handoff:
  from: implementer-B
  to: reviewer
  task: Э5-П2
  did:
    - "Правка 1 (первая копия только через сутки): у backup добавлен depends_on:
       scout: condition: service_healthy. Условие не любое — healthcheck scout
       зелёный только после init_db() в lifespan (backend/app/main.py), значит
       к первому проходу сайдкара файл базы уже существует."
    - "Совет 4 аудита (сеть на pull перед запуском): у backup добавлен
       pull_policy: never — без своего build compose иначе штатно пытается
       сначала стянуть тег из реестра."
    - "Правка 2 (файл-пустышка при обрыве): скрипт копии переписан — пишет во
       временное имя scout-<дата>.db.part и переименовывает в итоговое имя
       только после успешного backup(); при отказе временный файл удаляется
       в except. Закрытие обеих sqlite3-connection перенесено в finally
       (было — только в успешной ветке, на исключении оставалось открытым)."
    - "Правка 3 (бесконечное ожидание блокировки): добавлена константа
       LOCK_WAIT_TIMEOUT_SECONDS = 30 и progress-колбэк у src.backup(...),
       который считает время через time.monotonic() и поднимает TimeoutError
       при превышении предела; backup() вызывается с pages=1, чтобы колбэк
       вызывался на каждом шаге, а не один раз в конце. connect(...,
       timeout=1) сокращает внутренний busy-wait sqlite3, иначе первая
       проверка предела опаздывает на целый внутренний интервал (умолчание
       5 с). Отказ виден в stderr тем же except, что и раньше."
    - "Правка 4 (журнал без лимита): у backup добавлен тот же блок logging
       (json-file, max-size 10m, max-file 3), что у scout и caddy."
    - "Совет 5 аудита (имя проекта из каталога): добавлено name: techmost-scout
       на верхнем уровне compose-файла."
    - "Тесты: 4 обязательных по списку аудита (образ caddy — M8, mode=ro —
       M12, путь /data/scout.db — M13, logging — M14) плюс тесты на каждую
       свою правку. Тест на временное имя копии и на предел ожидания —
       сквозные прогоны тела скрипта (без Docker и сети, in-process exec()
       извлечённого текста на временных файлах pytest), проверяют свойство
       (нет файла-пустышки после обрыва; проход укладывается в разумное
       время при настоящей удерживаемой BEGIN EXCLUSIVE транзакции), а не
       подстроку — той же ловушки \"14 внутри 140\", о которой предупреждает
       задача, здесь избегали через диапазон (5..120 c) и точное сравнение
       через _script_constant, а не текстовый поиск."
    - "tests/test_docker_compose.py удерживался в пределах 500 строк (страж
       tests/test_tests_layout.py): убраны два чисто структурных AST-теста,
       чьё свойство полностью перекрывается более сильными сквозными
       прогонами (проверено — after removal все мутации остались красными)."
    - "Маркер _try_node_containing(tree, \"src.backup(dst)\") обновлён на
       \"src.backup(dst\" (без закрывающей скобки) — сигнатура вызова
       изменилась (добавлены pages=, progress=), старый маркер перестал
       матчиться."
  artifacts:
    - docker/docker-compose.yml
    - tests/test_docker_compose.py
    - .planning/evidence/Э5-П2-pytest.txt
    - .planning/evidence/Э5-П2-мутации.txt
