    - docker/docker-compose.yml (сервис backup — depends_on, pull_policy, logging,
      скрипт копии)
    - tests/test_docker_compose.py (новые тесты начиная с test_caddy_образ_закреплён_версией)
    - .planning/evidence/Э5-П2-мутации.txt (протокол по каждой правке)
  notes: |
    Живой Docker-демон не поднимался — только `docker compose config` со
    служебным пустым docker/.env (создан и удалён тем же прогоном, git status
    после проверки чист). Тесты на правки 2 и 3 запускают тело сайдкара как
    обычный Python-код в потоке-демоне на временных файлах pytest — тем же
    методом, каким аудит воспроизводил все три отказа («прогонов тела
    скрипта»); сети и Docker-демона это не требует (инвариант №7).

    Инструкцию деплоя (docs/deploy.md) не трогал — она у параллельной задачи.

    Один выбор, о котором стоит знать ревьюеру: значение
    LOCK_WAIT_TIMEOUT_SECONDS = 30 секунд — компромисс между «не ждать
    бесконечно» и «не спамить отказами при нормальной кратковременной
    занятости базы во время обычных запросов приложения». Тест закрепляет
    диапазон 5..120 с, а не точное число — конкретную цифру можно поменять
    без правки теста.
