    - "docker compose -f docker/docker-compose.yml --project-directory docker config (временный пустой docker/.env, удалён после): exit=0"
    - "git status --porcelain docker/ после проверки config: только 'M docker/docker-compose.yml', .env не оставлен"
    - "8 групп мутаций (M8, M12, M13, M14, депенды backup, pull_policy, name, полный откат
       скрипта копии) — каждая даёт минимум один красный тест из добавленного набора,
       восстановление возвращает зелёный; протокол — .planning/evidence/Э5-П2-мутации.txt"
