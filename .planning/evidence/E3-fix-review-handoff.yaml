    правилу — вердикт BLOCKED и разбор с владельцем, не возврат
    исполнителю на ещё одну попытку в рамках этого процесса.
    П-2, П-3, П-4, П-5 проверены по существу и закрыты, блокирующих в них
    нет — переоткрывать их не нужно, если владелец выберет вариант правки
    П-1 из развилки выше.
