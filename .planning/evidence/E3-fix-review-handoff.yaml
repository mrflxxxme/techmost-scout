    хуже исходного (двойной учёт вместо потери 0,18 ₽), второго цикла
    правок для аудита не предусмотрено.
    Вариант А: в persistence_write.py._write вернуть присваивание
    request_row.cost_rub = cost_rub (убрать сложение) — LLMRouter с
    initial_spent_rub уже отдаёт кумулятивную сумму, присваивание и есть
    верный перенос, тем же приёмом, что уже работает в intake.py.
    Вариант Б: оставить сложение в persistence_write.py, но в run_flow.py
    передавать в persist_run дельту фазы (router.cost.spent_rub минус
    initial_spent_rub), а не кумулятивный report.cost_rub целиком —
    требует развести "число для отчёта" и "число для persist_run".
    Рекомендую: А — меньше механизмов, единообразно с intake.py, CLI не
    затрагивает.
    Обратимость: обратима.
    Блокирует: подпись ворот Э3 целиком (условие аудита "не подписывать
    до закрытия П-1 и П-2"). Задачи вне Э3 не блокирует.
    Отдельно (не блокирует П-1, но территория владельца по §9 п.4): две
    новые клиентские фразы без визы — REFUSAL_ALREADY_DONE ("Отчёт по
    этому запросу уже готов. Открыть отчёт.") и перефразированный
