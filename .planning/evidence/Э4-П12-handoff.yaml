    факт, и причину одним проходом (сегодня `_kept_positions` уже вычисляет
    оба условия последовательно внутри себя — reject проверяется раньше
    evidence, — просто не возвращает, ЧТО именно сработало). Тогда review.py
    перестал бы отдельно смотреть на VerdictDecision.REJECT, и текст причины
    тоже был бы одним проходом с фактом видимости, а не двумя независимыми
    (пусть и оба явно читающими verdict/evidence, а не выдуманными).
    Сегодняшнее решение (probe-report + отдельный выбор текста) закрывает
    ровно то, что просит критерий задачи: мутация ОБЩЕГО признака обязана
