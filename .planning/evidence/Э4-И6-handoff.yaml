    существующая фраза РЕШ-202, новой не является).

    Маршрут GET /requests/{id}/export.pdf принимает необязательный query-параметр
    draft (по умолчанию false) — веб-аналог CLI-флага --draft (инвариант №2):
    кнопка страницы сама подставляет ?draft=true, когда отчёт ещё черновик;
    прямой переход по ссылке без параметра на drafted-запросе получает 400, а
    не тихо отдаёт черновик. В плане это явно не расписано отдельным критерием
    приёмки для веб-маршрута (только для CLI), но текстом «Что делает» задачи
    описано прямо («кнопка … передаёт признак черновика»), поэтому решение
    реализовано и покрыто тестами — на усмотрение ревью, стоит ли фиксировать
    отдельным пунктом критериев задним числом.

    Важная находка перед стартом (п. 0 инструкции, РЕШ-158): HEAD рабочей копии
    при входе в задачу был на ветке с материалами деков для партнёров (маркетинг,
    ХМАО) — совершенно не в истории волны Э4, backend/app/export/{view,pdf,docx}.py
    отсутствовали вовсе. Заданный базовый коммит 81817bb9 (Волна 1 Э4: отчёт
    ревью Э4-И3) НЕ был предком HEAD. Своих коммитов в рабочей копии не было
    (git status — чисто), поэтому вместо эскалации молча выполнено предписанное
    в постановке действие: `git switch -c e4/i6 81817bb9ee2c077e46e5fd742ed82f729b6b643f`
    — дальше работа шла на правильной базе. Сообщаю отдельно, потому что случай
    совпадает с описанием РЕШ-158 (устаревшая/не та база рабочей копии) и
    оркестратору стоит знать, что копия для этой задачи была создана не от
    ветки волны, а от чего-то другого.

    Живых вызовов export_pdf (Chromium)/export_docx не делалось — оба
    подменены заглушками во всех тестах, платных вызовов не было.
