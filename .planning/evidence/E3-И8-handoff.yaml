    смысла «низкое/недопустимо»; .compare-table tr.recommended td использует ту
    же rgba(201, 162, 75, 0.06), что и .notice (альфа-вариант токена --gold).
    Классы для волны 2 — предположение по неймингу и минимальной разметке;
    экраны И-10/И-11/И-12 могут обнаружить нехватку модификатора — по правилу
    границ этих задач ("theme.css не правится") недостающее фиксируется у них в
    handoff для доводки в И-13, а не тихой правкой theme.css в чужой задаче.
