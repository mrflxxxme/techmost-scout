    - "ruff format --check .: 190 files already formatted"
    - "rg -n \"LLMRouter|httpx|ScoutPipeline\" backend/app/pipeline/demo.py backend/app/web/routes/demo.py: пусто"
    - "rg -n demo_flag backend/app/pipeline/demo.py: пусто"
