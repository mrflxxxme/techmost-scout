    - .planning/PLAN.md (раздел «Э4-И7», «Контракты»)
    - backend/app/pipeline/demo.py
    - backend/app/web/routes/demo.py
  notes: >-
    Вердикт ПРИНЯТЬ, цикл 1, блокирующих нет. Два совета не блокируют:
    неиспользуемый log в web/routes/demo.py при отсутствии обработки
    исключений фоновой задачи (по аналогии с run.py, риск практически
    низкий), и неполный список клиентских фраз demo.html в handoff (текст
    вводного абзаца и пустого состояния списка). Отдельно для аудита волны
    отмечен межзадачный риск: общий на процесс ProgressBroker не освобождает
    каналы после done (известный долг, РЕШ-191 отложен на Э5-1); эта задача
    закрыла свой риск явными большими id, но структурная бомба для будущих
    тестов с маленькими id остаётся — стоит зафиксировать в DECISIONS.md или
    в аудите волны, не как повторную находку той же задачи.
