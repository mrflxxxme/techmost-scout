    - "Прогнаны tests/test_demo_playback.py (11 passed) и tests/test_web_demo.py (7 passed), полный pytest -q дважды подряд (1047 passed оба раза), tests/test_web_flow_e2e.py отдельно (1 passed) — интерференция через общий ProgressBroker не проявилась"
    - "Проверены все грепы критериев задачи: LLMRouter|httpx|ScoutPipeline и demo_flag в demo.* — пусто; request_id == N в routes/demo.py — пусто; секреты в новых файлах — пусто"
    - "Мутационно проверена находка исполнителя (потолок fraction 0.99): без потолка падают test_only_final_done_step_reaches_full_fraction и test_start_publishes_events_stream_gets_stage_message_fraction (последний — на настоящем ProgressBroker через SSE); файл восстановлен после проверки, git diff чист"
    - "Мутационно проверен инвариант №1 в показе: подмена числа в _search_message на выдуманное валит test_search_message_uses_real_sources_hit_numbers_not_invented"
    - "Проверены все десять инвариантов и раздел «Границы» задачи — нарушений и выхода за границы не найдено"
    - "ruff check . и ruff format --check . — 0 замечаний"
  artifacts:
    - .planning/evidence/Э4-И7-review.md (закоммичен до ответа)
    - .planning/evidence/Э4-И7-review-handoff.yaml
  self_audit: pass
  checks:
    - "pytest tests/test_demo_playback.py -v: 11 passed"
    - "pytest tests/test_web_demo.py -v: 7 passed"
    - "pytest -q (прогон 1): 1047 passed"
    - "pytest -q (прогон 2): 1047 passed"
