handoff:
  from: "implementer-1"
  to: "reviewer"
  task: "Э4-И3"
  did:
    - "Реализован экран ревью эксперта: GET /requests/{id}/review показывает карточки обеих секций отчёта (основная и конкурсная, без фильтра reject — эксперт должен видеть свои прежние отклонения) в одну колонку, у каждой карточки — форма вердикта."
    - "Реализован POST /cards/{card_id}/verdict: пишет НОВУЮ строку verdicts (ничего не обновляется и не удаляется), отдаёт HTML-фрагмент с записанным вердиктом и счётчиком «N из M»; при вердиктах у всех строк solution_cards обеих секций переводит запрос в validated, не понижая exported."
    - "Отказы без записи строки: пустое имя проверяющего — 400 человеческой фразой; оценка вне 1-5 — 400; неизвестное решение — 400; несуществующая карточка — 404."
    - "backend/app/web/routes/__init__.py: подключён router из review.py."
    - "backend/app/web/static/theme.css: добавлено правило .verdict-form select/input/textarea/button { min-height: 44px } — кнопки и поля формы вердикта не меньше 44px (SPEC Э4-1, экран открывается с телефона)."
    - "backend/app/web/templates/review.html: новый шаблон, карточки одной колонкой (без grid two/three), без style= и hex-цветов."
    - "tests/test_web_auth.py: в параметризацию test_routes_require_auth добавлен путь /requests/1/review."
    - "tests/test_web_review.py: новый файл, 7 тестов (форма на карточки обеих секций; два вердикта подряд — две строки; validated только после вердиктов по всем карточкам, включая обе секции; validated не наступает при неполном покрытии; оценка вне 1-5 отклоняется без записи; пустое имя отклоняется без записи, инвариант №2; exported не понижается до validated)."
  artifacts:
    - "backend/app/web/routes/review.py"
    - "backend/app/web/routes/__init__.py"
    - "backend/app/web/templates/review.html"
    - "backend/app/web/static/theme.css"
    - "tests/test_web_review.py"
    - "tests/test_web_auth.py"
    - ".planning/evidence/Э4-И3-pytest.txt"
  self_audit: pass
  checks:
    - "pytest tests/test_web_review.py -v: 7 passed"
    - "pytest tests/test_web_templates.py -v: 5 passed (2 общих проверки style/hex + 3 параметризованных рендера страниц — review.html автоматически проверен общими проверками style=/hex через сканирование всех *.html в каталоге шаблонов)"
    - "pytest tests/test_web_auth.py -v: 6 passed (добавлен параметр /requests/1/review)"
    - "pytest -q: 1011 passed (было ≥969 + 8 новых: 7 в test_web_review.py + 1 новый параметр в test_web_auth.py)"
    - "ruff check .: All checks passed!"
    - "ruff format --check .: 182 files already formatted"
    - "rg -n 'min-height: 44px' backend/app/web/static/theme.css: 1 совпадение (строка 401)"
    - "rg -n 'grid two|grid three' backend/app/web/templates/review.html: совпадений нет"
  escalate: none
  read_first:
    - ".planning/PLAN.md (раздел «Э4-И3 · Экран ревью эксперта», блок «Контракты» → «Вердикты»)"
    - "docs/SPEC.md (§6, строки 629-645)"
    - "backend/app/web/routes/review.py"
    - "backend/app/web/templates/review.html"
    - "tests/test_web_review.py"
  notes: >-
    Расхождение с текстом критерия 2 плана: команда `pytest tests/test_web_templates.py -v`
    даёт фактически 5 прошедших тестов, а не 3 — в файле 3 функции `def test_`, но одна из
    них параметризована тремя путями (`/`, `/requests`, `/showcase`), и pytest -v печатает
    их отдельными строками. Файл не в списке моих файлов, не правил; фактический вывод
    приложен, поведение (нет style=/hex в review.html) подтверждено.

    Экран ревью сознательно не использует `export.view.build_export_view` — тот сборщик
    готовит клиентский вид (фильтр reject, переиндексация позиций), а эксперту на экране
    ревью нужны ВСЕ карточки обеих секций без фильтра, включая уже отклонённые: иначе
    поставленный ранее reject нельзя было бы увидеть и пересмотреть. Читает сырой отчёт
    через `pipeline.persistence.load_report` и исходные id `solution_cards` напрямую.

    Форма правки карточки не продублирована (РЕШ-196 п. 5) — экран ревью содержит только
    форму вердикта, ссылки на правку карточки нет (правка остаётся на странице отчёта,
    Э4-И2). Скоринг по вердиктам (Э2-4) не делался — вне границ задачи.

    Новые клиентские фразы (список на визу владельца, РЕШ-143 п. 7):
      - Заголовок страницы и h1: "Ревью эксперта" / "Проверка решений — запрос №{id}"
      - Подзаголовок: "Отрасль: {industry} · проверено {N} из {M}"
      - Заголовок секции: "Варианты решений" (уже использовалась в report.html)
      - Пустой список: "Карточек к проверке нет."
      - Заглушка карточки без id в базе: "Карточка не найдена в базе — вердикт поставить нельзя."
      - Метки формы: "Решение", "Оценка (1–5)", "Комментарий", "Имя проверяющего"
      - Опции решения: "Одобрить", "На доработку" (уже использовалась в _card.html как бейдж),
        "Отклонить"
      - Кнопка: "Записать вердикт"
      - Фрагмент результата: "Вердикт записан: {label}, оценка {N}/5, проверяющий {имя}
        {— комментарий}. Проверено {N} из {M}."
      - Подписи решений во фрагменте результата: "Одобрено", "На доработку", "Отклонено"
      - Отказ пустого имени: "Укажите имя проверяющего — без имени вердикт не засчитывается."
      - Отказ по оценке: "Оценка должна быть от 1 до 5."
      - Отказ по неизвестному решению: "Неизвестное решение — выберите «Одобрить»,
        «На доработку» или «Отклонить»."
      - "Карточка №{id} не найдена." (переиспользует форму фразы run.py "Запрос №{id} не найден.")
      - "Запрос №{id} не найден." (буквальное совпадение с существующей фразой run.py —
        не новая, переиспользована как есть)
      - "Отчёт по этому запросу ещё не готов — прогон не завершился или закончился отказом."
        (дословно перенесена из report.html — не новая)
