    критериев в один тест) именно из-за этого потолка. test_tests_layout.py
    не в списке моих файлов, править не мог; если предел станет мешать
    следующей задаче на этих файлах — решение per владельца/оркестратора.

    Живой вызов модели не делался. Боевая база открывалась только на чтение
    через копию (см. checks) — критерий 5 подтверждён на настоящих данных
