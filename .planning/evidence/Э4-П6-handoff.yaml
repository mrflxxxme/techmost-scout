    - "Критерий 2 (регрессия include_caveats=True/render_markdown): побайтовое сравнение вывода render_markdown на богатой фикстуре (caveats с PAID_LIMIT_NOTICE и прозой, sources_unavailable, contest_cards, comparison_rows) до и после правки — через git stash markdown.py/pdf.py/docx.py, повторный прогон, diff before.md after.md → пусто. Компактный тест на limitations_lines(include_caveats=False) добавлен в test_export_markdown.py как постоянный регрессионный страж (7 строк бюджета файла — подробности в notes)"
    - "Критерий 3 (регрессия БЛОК-4): новый тест test_render_print_html_limitations_section_appears_for_machine_notice_only — sources_unavailable=[], caveats=[PAID_LIMIT_NOTICE], карточка скрыта → раздел «Ограничения этого поиска» появляется и несёт пометку (до правки раздела не было бы вовсе)"
    - "Критерий 4 (П-10 повторного аудита): новые тесты с непустой конкурсной секцией и всеми карточками видимыми (test_render_print_html_printable_count_includes_contest_cards в pdf.py, часть test_машинная_пометка_и_учёт_конкурсных_карточек в docx.py) — вручную проверены мутацией 'len(print_cards)'/'len(printable_cards)' без прибавления конкурсной секции: тест падает с сообщением, что рекомендация заменена заглушкой хотя скрытых карточек нет; мутация отменена, git diff после отмены пуст (см. checks)"
    - "Критерий 5: реальный ExportView запроса №8 собран на копии боевой базы (data/scout.db скопирован в scratchpad, DATABASE_URL указывал на копию, оригинал не открывался на запись — md5 до/после совпадает) — PAID_LIMIT_NOTICE снова печатается и в PDF, и в DOCX; вся остальная проза из caveats (5 оговорок модели) корректно скрыта"
