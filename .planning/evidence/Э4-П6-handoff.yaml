  notes: >-
    Замечание за границами задачи, не решал молча: SUMMARY_FALLBACK_NOTICE в
    markdown.py — точная копия строкового литерала из
    pipeline/summary.py::fallback_summary, а не импорт именованной константы.
    Постановка задачи разрешает только импортировать существующие константы
    оговорок, не трогая pipeline/*; но pipeline/summary.py не заводит для этой
    оговорки отдельного имени (только инлайн-литерал в списке caveats), а
    завести обратный импорт из markdown.py в pipeline/summary.py нельзя —
    summary.py уже импортирует MATURITY_RU/CONFIDENCE_RU из markdown.py, и
    обратная связь создала бы цикл через пакет app.pipeline (проверено:
    app.pipeline.__init__ тянет orchestrator.py, тот — app.export.markdown за
    PAID_LIMIT_NOTICE; попытка импортировать app.pipeline.intake_flow на
    уровне модуля markdown.py воспроизвела этот цикл на живую и была заменена
    отложенным импортом внутри _machine_caveats(), тем же приёмом, что уже
    применяется в run_flow.py для PAID_LIMIT_NOTICE). Если текст в summary.py
    когда-нибудь изменится без синхронной правки константы здесь — оговорка
    отказа сводки перестанет распознаваться как машинная и будет тихо
    скрываться как проза модели. Владельцу стоит решить: завести в
    pipeline/summary.py именованную константу (правка вне границ этой задачи)
    или явно принять риск дублирования литерала.

    Файлы test_export_docx.py (ровно 500 строк) и test_export_markdown.py
    (493 строки) были уже близки к пределу test_tests_layout.py на входе в
    задачу — новые тесты по критериям 1/3/4 пришлось писать предельно
