  notes:
    - "Живого запуска нет (DLG-Э6-3): workflow_dispatch идёт из ветки по умолчанию, секретов у агентов нет; docker, ssh и caddy в среде отсутствуют, actionlint тоже. Проверено текстовым стражем, bash -n всех шагов и локальными прогонами шагов с заглушками."
    - "Автономные решения исполнителя. (а) Хэш пароля считает сам скрипт командой docker exec -i edge-caddy caddy hash-password с паролем через stdin (чтение stdin вне терминала — по исходникам Caddy, живьём не проверено); пароль читается из docker/.env на сервере и не покидает его; умолчание change-me отвергается. (б) Хэш bcrypt солёный, поэтому при каждом caddy-apply строка хэша меняется; идемпотентность по тексту — при том же хэше, в рабочем прогоне файл переписывается и reload идёт заново — это безвредно. (в) Шаблон и скрипт доставляются с раннера из ветки запуска, ref определяет только код на сервере. (г) Прежний немаркированный блок принимается и для хоста скана, если его адреса только наши; блок, где наш хост рядом с чужим адресом, — отказ. (д) Значения с пробелом, кавычкой, решёткой, долларом, обратной косой env-upsert отвергает (compose прочёл бы иначе). (е) Пустое значение не стирает ключ, поэтому PUBLIC_SCAN_HOST через workflow можно задать, но не очистить. (ж) Удалённые скрипты обёрнуты в функцию main: bash -s читает программу из stdin, и docker compose exec или git могли бы съесть остаток скрипта. (з) Предыдущий коммит для отката печатается в журнал шага, отдельного файла нет. (и) Пустая EDGE_NEIGHBOR_URLS останавливает caddy-apply до правок. (к) В проверке JSON-API мимо пароля используется заголовок WWW-Authenticate: Basic как признак ответа прокси."
    - "Добавка оркестратора: request_body max_size 32KB (форма до 3000 знаков, в url-кодировке до 18 КБ) и Content-Security-Policy сделаны в шаблоне только для хоста скана. Политика: default-src self, script-src self, style-src self и unsafe-inline (htmx добавляет встроенный стиль индикатора), img-src self data, base-uri none, form-action self, frame-ancestors none. Сверено с scan_base.html, scan_form.html, scan_result.html, _scan_progress.html: скрипты и стили только из /static/. Раздел 12 docs/deploy.md (Э6-6в) не трогался: страж проверяет, что блок раздела 12 входит в блок шаблона как подпоследовательность, а две добавленные строки описаны в разделе 13. После слияния Э6-6в оркестратору стоит решить, переносить ли эти два рубежа в блок раздела 12."
    - "Для оркестратора при слиянии с Э6-6в: docs/deploy.md правился двумя местами — абзац-указатель во вводной части и новый раздел 13 в конце файла; раздел 12 не менялся. Конфликт возможен только если Э6-6в тоже дописывает конец файла."
    - "Первый деплой на чистом сервере: если контейнера scout ещё нет, копия базы пропускается с сообщением, а не молча по имени тома. Сервер после deploy стоит на отсоединённом HEAD — записано в разделе 13."
    - "Ротация сайдкара чистит /backups/scout-*.db, поэтому копии scout-predeploy-*.db живут те же 14 дней. За границами задачи ничего не правилось."
