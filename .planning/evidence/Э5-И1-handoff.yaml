    - "pytest tests/test_docker_image.py -v (строка chmod возвращена): 10 passed"
    - "pytest -q: 1236 passed, 1 warning in 70.12s (0:01:10)"
    - "ruff check .: All checks passed!"
    - "ruff format --check .: 207 files already formatted"
  escalate: none
  read_first:
    - docker/Dockerfile
    - tests/test_docker_image.py
  notes: >-
    Правки внесены в ту же ветку wave5/e5-i1-image, границы прежние —
