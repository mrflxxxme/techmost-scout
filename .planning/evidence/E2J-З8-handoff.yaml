  notes: |
    Расхождение с номерами пунктов в карточке задачи: карточка называет
    провайдерную правку «§2 п.2–3», но фактическая нумерация SPEC — п.1
    (модель по стадии, там и жил GigaChat-2 Lite) и п.3 (источники поиска,
    там OpenAlex). Пункт 2 — про порядок сообщений для кэша DeepSeek, к
    GigaChat отношения не имеет. Правил по содержанию (GigaChat — в п.1,
    OpenAlex — в п.3), не по числу в карточке; несовпадение отмечаю, не
    решаю молча.

    За границами задачи, не правил, только называю:
    - docker/Dockerfile содержит COPY docker/certs/*.crt, ENV
      GIGACHAT_CA_BUNDLE и комментарий «иначе GigaChat не пройдёт TLS» —
      живой код с мёртвым провайдером внутри. Это код, не входит в список
      файлов задачи (docs/SPEC.md, CLAUDE.md, docs/remote-setup.md). Раз он
      ещё не почищен, я НЕ стал утверждать в SPEC (Э5-1), что сертификат
      не нужен — написал честнее: провайдер выпилен, а Dockerfile
      унаследовал старые строки, почистить в этой же будущей задаче.
      Работающее (пусть и дефектное) первично: если бы я просто убрал
      требование из SPEC, будущий исполнитель Э5-1 не узнал бы, что
      Dockerfile нужно чинить, и мог бы получить провал сборки на
      `COPY docker/certs/*.crt` без объяснения причины.
    - docs/remote-setup.md (файл дан на «сверку», не в основной список
      правки) утверждает «GIGACHAT_AUTH_KEY — основная модель, бесплатный
      тариф» и LLM_STAGE_ROUTES с extractor:gigachat — тоже стало неверно
      после РЕШ-171. Критерии приёмки задачи грепают только docs/SPEC.md и
      CLAUDE.md, этот файл в них не входит — не правил, чтобы не выйти за
      явно очерченный список; отдельная небольшая задача на будущее.
    - .env.example тоже несёт «ОБЯЗАТЕЛЬНО. GigaChat — основная модель»,
      LLM_STAGE_ROUTES=...,extractor:gigachat, LLM_FALLBACK_ORDER=gigachat,
      deepseek,yandex — при копировании в .env это упадёт на страже
      неизвестного провайдера (РЕШ-171). Файл не в списке задачи — не
      правил.
    - docs/SPEC.md:333 упоминает «Проверки статусов в Э2-2б, Э2-3 и Э2-6
      опираются на неё же [доработку doctor]» — оставил как есть: она
      по-прежнему верна (`scout doctor` показывает и patents_view, просто
      теперь навсегда «не реализовано» после РЕШ-172), значения задачи не
      меняет.

    Все правки атомарны по месту и обоснованы ссылкой на РЕШ; отдельных
    промежуточных коммитов по каждой правке не делал — задача одноразовая
    синхронизирующая правка документов без риска регресса кода (правки
    только .md), один коммит после того как весь набор мест сошёлся и все
    проверки позеленели.
