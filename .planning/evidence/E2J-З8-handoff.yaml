  notes: |
    Цикл 1 → цикл 2: ревьюер верно указал, что docs/remote-setup.md был
    назван в карточке задачи («Файлы: ... docs/remote-setup.md (сверка)»),
    но я прочёл «сверка» слишком узко — как «проверить, не противоречит»,
    а не как «привести в соответствие», и, найдя расхождения, только
    вынес их в notes вместо правки. Ревью показало, что это неверное
    прочтение: раз файл в списке задачи, а не за его границами — его
    правка входит в объём. Принято, исправлено.

    Расхождение с номерами пунктов в карточке задачи (сохраняется из цикла
    1, не влияет на приёмку): карточка называет провайдерную правку «§2
    п.2–3», но фактическая нумерация SPEC — п.1 (модель по стадии, там и
    жил GigaChat-2 Lite) и п.3 (источники поиска, там OpenAlex). Пункт 2 —
    про порядок сообщений для кэша DeepSeek, к GigaChat отношения не имеет.
    Правил по содержанию, не по номеру карточки.

    За границами задачи, не правил, только называю:
    - docker/Dockerfile содержит COPY docker/certs/*.crt, ENV
      GIGACHAT_CA_BUNDLE и комментарий «иначе GigaChat не пройдёт TLS» —
      живой код с мёртвым провайдером внутри. Код не входит в список файлов
      задачи. SPEC (Э5-1) явно указывает, что Dockerfile ещё не почищен, —
      не стал утверждать в SPEC, что сертификат не нужен, пока код этого не
      подтверждает: работающее (пусть и дефектное) первично.
    - .env.example тоже несёт «ОБЯЗАТЕЛЬНО. GigaChat — основная модель»,
      LLM_STAGE_ROUTES=...,extractor:gigachat, LLM_FALLBACK_ORDER=gigachat,
      deepseek,yandex — при копировании в .env это упадёт на страже
      неизвестного провайдера (РЕШ-171). Файл не был назван в карточке
      задачи ни разу (в отличие от remote-setup.md) — не правил.
    - docs/SPEC.md:333 упоминает «Проверки статусов в Э2-2б, Э2-3 и Э2-6
      опираются на неё же [доработку doctor]» — оставил как есть: она
      по-прежнему верна, значения задачи не меняет.

    Промежуточных коммитов по циклу 2 не делал: правка по одной ревью-
    находке плюс два дешёвых совета, все три места малы, взаимозависимы
    (один и тот же факт — провайдер и число стадий) и проверены одним
    прогоном pytest/ruff перед коммитом.
