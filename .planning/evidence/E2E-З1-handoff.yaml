handoff:
  from: implementer-A
  to: reviewer
  task: З-1
  did:
    - "Написан диагностический скрипт scripts/rescore_probe.py (вне поставки,
       РЕШ-119): читает пул кандидатов запроса из data/scout.db только на
       чтение (sqlite URI ?mode=ro), собирает батчи ровно по 10 в порядке
       дедупликации (ORDER BY id) и прогоняет их через боевую стадию
       app.pipeline.stages.score_candidates поверх app.llm.LLMRouter —
       промпт prompts/scorer.md не тронут ни одной буквой."
    - "Бриф не читается из базы (таблица briefs пуста, РЕШ-156): подаётся
       файлом --brief-file (JSON схемы Brief), печатается в отчёт дословно
       вместе с путём файла как указанием источника восстановления."
    - "citations=None передаётся явно на каждый батч; отдельная строка вывода
       называет это отличие от боевого прогона, а не замалчивает его."
    - "Флаг --dry-run печатает состав всех батчей и число будущих платных
       вызовов, не создавая LLMRouter и не тратя ни рубля — им же проверена
       работа скрипта на реальной базе (см. checks)."
    - "Печатается распределение relevance (0×N, 1×N, ...), min/медиана/max
       по оценкам МОДЕЛИ (has_neutral_score из app.pipeline.stages исключает
       нейтральные пятёрки — следы отказа батча), число >=3 и >=4, число
       нейтральных оценок, провайдер/модель стадии scorer, стоимость прогона."
    - "tests/test_rescore_probe.py — 16 тестов на подменах (FakeProvider из
       conftest, временные sqlite-базы через tmp_path), без единого сетевого
       вызова. Прицельно (РЕШ-135) проверены все четыре мутации из
       постановки: батч 20 вместо 10, сортировка вместо порядка id, передача
       citations, база без mode=ro — все четыре ловятся тестами; дерево после
       каждой мутации восстановлено и сверено побайтово (diff чистый)."
    - "Живой платный прогон НЕ выполнялся — это работа оркестратора (§9 п. 2).
       Выполнен только --dry-run на реальной read-only базе data/scout.db:
       112 кандидатов запроса 1, 12 батчей (11×10 + 1×2), ни одного вызова
       модели и ни рубля расхода."
  artifacts:
    - scripts/rescore_probe.py
    - tests/test_rescore_probe.py
  self_audit: pass
  checks:
    - ".venv/bin/python scripts/rescore_probe.py --help — код возврата 0,
       параметры --db, --request, --brief-file, --limit названы (проверено
       текстом справки)"
    - "grep -nE '^import httpx|^from httpx' scripts/rescore_probe.py — нет
       совпадений; grep -n LLMRouter scripts/rescore_probe.py — есть"
    - "pytest tests/test_rescore_probe.py -v: 16 passed"
    - "pytest -q: 714 passed (698 базовых + 16 новых), 0 failed"
    - "ruff check scripts/rescore_probe.py tests/test_rescore_probe.py: All
       checks passed"
    - "ruff format --check scripts/rescore_probe.py tests/test_rescore_probe.py:
       2 files already formatted"
    - "Живой --dry-run на data/scout.db --request 1: 112 кандидатов, 12
       батчей — числа сошлись с постановкой (112 кандидатов, ~12 батчей)"
  escalate: none
  read_first:
    - .planning/PLAN.md (задача З-1, строки 225-310)
    - docs/SPEC.md §0.1 (грабли)
    - scripts/rescore_probe.py
    - tests/test_rescore_probe.py
  notes: |
    База своей рабочей копии на старте отставала от верхушки ветки волны
    (была на 87575fe, ветка — на b1e9c36, разница в четыре коммита: анализ
    обеднения и план волны Э2-Е). Подтянул fast-forward мёржем до первой
    строки кода — своих коммитов в копии на тот момент не было, работа не
    потеряна (РЕШ-158).

    Формат --brief-file — JSON по схеме Brief (industry, task_summary,
    constraints, target_maturity, ...), не markdown. Бриф для запроса 1
    (Э2-Г, фарма/свиноводство) восстановлен вручную из
    .planning/evidence/E2G-gate-фарма.md для собственной проверки скрипта
    (industry: "свиноводство", constraints:
    ["точность определения состояния — 95-98%"], target_maturity:
    "prototype") — файл лежал во временном каталоге сессии, в репозиторий не
    попал; для живого прогона оркестратору нужно будет подготовить такой же
    файл и сохранить его в .planning/evidence/ рядом с итоговым отчётом
    (в постановке это не названо отдельным критерием, но без файла живой
    прогон не запустить).

    LLMRouter(settings) без providers= читает реальные ключи из окружения —
    для дальнейшего живого прогона это ожидаемо (иначе роутер не сможет
    вызвать API), но означает, что запуск без --dry-run на машине с боевыми
    ключами будет платным немедленно; сам я такой прогон не делал ни разу.

    За границами задачи: docs/marketing/deck/*.py уже не проходят
    ruff check/format (лишние точки с запятой, mixedCase-переменная) — это
    подъехало слиянием main "маркетинговые материалы компании" до начала
    моей работы, я это не трогал и не чинил (не моя задача).
