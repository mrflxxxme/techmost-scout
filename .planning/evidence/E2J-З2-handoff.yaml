    - >
      Кэш и раньше ключевался точным телом запроса (включая q), то есть
      фактически отправленным текстом — правка не потребовалась, только
      подтверждено тестом и мутацией (б), что нулевая длинная форма не
      заслоняет результат короткой.
    - >
      В лог поиска (уровень INFO) пишутся обе формы запроса и оба found —
      диагноз следующего нуля читается из журнала прогона без контрольных
      вызовов.
    - >
      docs/sources.md: добавлен раздел «Диагноз Э2-Ж: длина формулировки
      съедает выдачу» с таблицей чисел (8 слов → 0, «супоросность свиноматок
      УЗИ», 3 слова → 21, контроль «гидроочистка дизельного топлива» → 720).
    - >
      tests/test_search_cyberleninka.py: добавлено 6 тестов — повтор при
      found=0 с проверкой лога и повторного вызова из кэша, честный пустой
      список на обеих формах, SearchError на отказе повтора, пауза между
      запросами на повторе, детерминизм и сохранение порядка укорачивания,
      неизменность уже короткого запроса.
