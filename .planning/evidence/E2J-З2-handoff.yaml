      первыми 3-4 содержательными словами без стоп-слов, порядок слов
      сохранён, без обращения к модели. Больше одного повтора не делается.
    - >
      Маленький детерминированный стоп-словарь (_STOP_WORDS) и функция
      _shorten_query живут в самом адаптере, не в отдельном файле и не в
