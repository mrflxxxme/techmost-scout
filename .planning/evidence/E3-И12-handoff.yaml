    - "grep -rniE вердикт|verdict|ревью backend/app/web/templates/report.html backend/app/web/templates/_card.html: совпадений нет (критерий 3)"
    - "wc -l backend/app/web/routes/report.py backend/app/export/markdown.py: 203 и 301 строк — оба меньше 500"
