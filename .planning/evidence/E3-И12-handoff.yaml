handoff:
  from: implementer-3
  to: reviewer
  task: "Э3-И12"
  did:
    - "Реализован GET /requests/{request_id}/report в backend/app/web/routes/report.py: читает отчёт через persistence.load_report (из requests.report_json, а не из solution_cards — РЕШ-189 п. 4), находит id и editor_overrides строк solution_cards по ключу (is_contest, position) и накладывает их через app.report_overrides.apply_overrides (И-7)"
    - "Реализован POST /cards/{card_id}/edit: белый список текстовых полей (title, essence, applicability, next_step, developer_org, developer_team) плюс risks/contact_leads (список строк — форма собирает их textarea по строке на пункт и разбирает построчно перед записью); confidence, requirement_checks, unsourced_claims в параметрах обработчика нет вовсе — прислать их нельзя даже случайно; добавить новую строку evidence нельзя, можно только удалить существующую по URL (evidence_removed, накопительно между правками)"
    - "Вход формы валидируется в маршруте (isinstance(str)) — заметка ревью И-7 учтена: мусорный/пустой POST не роняет обработчик 500-й"
    - "Новые шаблоны report.html и _card.html: пометка «ЧЕРНОВИК — не проверено экспертом» до валидации (не снимается сохранением правки — РЕШ-189 п. 6), .maturity на четырёх засечках, .badge/.badge.low для уверенности, обязательный блок «Чем подтверждено», красная плашка «Нельзя показывать клиенту: нет подтверждений» и скрытие стадии зрелости и TRL при пустом evidence (инвариант №1), сравнительная таблица (.table-wrap/.compare-table) и рекомендация из summary, ссылки evidence — кликабельные href"
    - "backend/app/export/markdown.py: строки блока «Ограничения этого поиска» вынесены в новую функцию limitations_lines(report) без новых формулировок; render_markdown и страница отчёта используют один и тот же вывод (РЕШ-189 п. 5)"
    - "Все использованные на странице человекочитаемые тексты подтверждений/полей карточки (Разработчик, Применимость к задаче, Следующий шаг, Риски, Как выйти на связь, Сверка с требованиями задачи, Господдержка, Не подтверждено проверкой, Чем подтверждено, Требования и ограничения, Сравнение вариантов, Варианты решений, Рекомендация) — дословные повторы уже существующих формулировок backend/app/export/markdown.py, новых слов в них нет"
    - "Тесты tests/test_web_report.py, 13 штук: страница из report_json без строк solution_cards; черновик и его выживание после правки; пустой evidence прячет зрелость/TRL и даёт плашку; правка title видна после перезагрузки при неизменном report_json; попытка прислать confidence/новый evidence игнорируется; удаление строки evidence; таблица сравнения и рекомендация из summary; блок ограничений совпадает построчно с limitations_lines; кликабельные ссылки; мусорная форма и несуществующая карточка/запрос не роняют обработчик"
