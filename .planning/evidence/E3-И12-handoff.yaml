    - "Цикл 2, БЛОКИРУЮЩЕЕ 1 (регрессия render_markdown, инвариант №8): восстановлена пустая строка-разделитель между абзацем «Не ответили источники…» и списком оговорок в limitations_lines — она ставится только при непустых обоих. Сверено байт-в-байт со старой версией (git show 732c4063:backend/app/export/markdown.py) на 4 сценариях (источники/оговорки/оба/ничего) — идентично. Добавлен целевой тест в tests/test_web_report.py, tests/test_export_markdown.py не тронут"
    - "Цикл 2, БЛОКИРУЮЩЕЕ 2 (фразы без визы, РЕШ-143 п. 7): ветка «report is none» report.html больше не подставляет сырой текст исключения (уходит в log.info, не на страницу); заголовок ветки приведён к «Подбор решений — запрос №N», как в основной ветке; «стоимость обработки» исправлено на «стоимость машинной обработки» — дословно как markdown.py:177 (это уже одобренный текст, не новая фраза); добавлен тест на ветку без report_json (человеческий текст, без traceback и без слов report_json/схемой)"
