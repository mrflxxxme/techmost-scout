    - "Все использованные на странице человекочитаемые тексты подтверждений/полей карточки (Разработчик, Применимость к задаче, Следующий шаг, Риски, Как выйти на связь, Сверка с требованиями задачи, Господдержка, Не подтверждено проверкой, Чем подтверждено, Требования и ограничения, Сравнение вариантов, Варианты решений, Рекомендация, стоимость машинной обработки) — дословные повторы уже существующих формулировок backend/app/export/markdown.py, новых слов в них нет"
    - "Тесты tests/test_web_report.py, 15 штук (было 13, цикл 2 добавил 2): страница из report_json без строк solution_cards; черновик и его выживание после правки; пустой evidence прячет зрелость/TRL и даёт плашку; правка title видна после перезагрузки при неизменном report_json; попытка прислать confidence/новый evidence игнорируется; удаление строки evidence; таблица сравнения и рекомендация из summary; блок ограничений совпадает построчно с limitations_lines; разделитель между источниками и оговорками не теряется (новое, цикл 2); ветка без report_json даёт человеческий текст без внутренностей исключения (новое, цикл 2); кликабельные ссылки; мусорная форма и несуществующая карточка/запрос не роняют обработчик"
