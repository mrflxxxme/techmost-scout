  notes: >
    Работа не блокирована, escalate: none — но по правилу волны (РЕШ-143 п. 7)
    новые клиентские фразы собираются здесь, и оркестратор несёт их владельцу
    одним списком перед воротами Э3, а не эта задача поодиночке.

    Новые клиентские фразы (критерий 6 задачи И-12), которых не было в коде до
    этой задачи — актуальный список после цикла 2, для визы владельца. Уже
