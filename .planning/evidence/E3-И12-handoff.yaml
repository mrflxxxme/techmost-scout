    клиенту: нет подтверждений») и дословные повторы существующих формулировок
    markdown.py (в т.ч. «стоимость машинной обработки», исправлено в цикле 2)
    в список ниже не входят — они не новые.

    Заголовки и подписи страницы: «Отчёт» (kicker), «Подбор решений — запрос
    №N» (h1 — в цикле 2 эта же формулировка перенесена и в ветку «report is
    none», раньше там было другое, рассогласованное «Отчёт запроса №N» —
    правка блокирующего замечания 2), «статус:» (метка перед status_label,
    пропущена в списке цикла 1 — добавлена сейчас), «Задача:» (метка перед
    task_summary — в markdown то же самое печаталось заголовком «## Задача»,
    здесь как инлайн-метка), «Пригодных вариантов не найдено.» (markdown-версия
    была курсивом «_..._», здесь обычный текст — смысл тот же).

    Ветка «отчёт ещё не готов» (report is none) — в цикле 2 сырой текст
    исключения убран со страницы (уходит в лог), заменён человеческой фразой:
    «Отчёт по этому запросу ещё не готов — прогон не завершился или
    закончился отказом.» — новая фраза, требует визы.

    Подписи полей формы правки карточки: «Название», «Суть», «Применимость к
    задаче» (без двоеточия — как подпись поля, не как метка чтения),
    «Следующий шаг» (то же), «Риски (по одному на строку)», «Как выйти на
    связь (по одному на строку)», «Организация-разработчик», «Команда
    разработчика».

    Управляющие элементы: «Убрать подтверждение из карточки:» (подпись у
    списка чекбоксов удаления evidence), «Править карточку» (заголовок
    сворачиваемого блока правки, <details><summary>), «Сохранить правки»
    (текст кнопки отправки формы).

    Ссылка на PDF: «Полный текст (PDF)» — в markdown было «Полный текст:
    [PDF](url)», здесь текст ссылки объединён в одну фразу без отдельного
    слова перед скобкой.

    Решения по границам задачи: POST /cards/{card_id}/edit возвращает
    RedirectResponse (303) на GET-страницу отчёта того же запроса — простой
    паттерн post-redirect-get без HTMX, укладывается в контракт волны (HTMX
    здесь не требовался явно, инлайновый style= не заводился, hex-цветов нет).
    theme.css не тронут — все нужные классы уже были заведены задачей И-8
    (.draft-banner, .notice.danger, .table-wrap, .compare-table, .card-edit,
    .maturity, .badge/.badge.low); нехватки классов не обнаружено, эскалации
    к И-13 нет.
