  notes: >
    Работа не блокирована, escalate: none — но по правилу волны (РЕШ-143 п. 7)
    новые клиентские фразы собираются здесь, и оркестратор несёт их владельцу
    одним списком перед воротами Э3, а не эта задача поодиночке.

    Новые клиентские фразы (критерий 6 задачи И-12), которых не было в коде до
    этой задачи — списком для визы владельца. Уже одобренные тексты
    («ЧЕРНОВИК — не проверено экспертом», «Нельзя показывать клиенту: нет
    подтверждений») использованы дословно, в список ниже не входят.

    Заголовки и подписи страницы: «Отчёт» (kicker), «Подбор решений — запрос
    №N» (h1), «Задача:» (метка перед task_summary — в markdown то же самое
    печаталось заголовком «## Задача», здесь как инлайн-метка),
    «Пригодных вариантов не найдено.» (markdown-версия была курсивом и с
    подчёркиванием смысла «_..._», здесь обычный текст — смысл тот же).

    Подписи полей формы правки карточки: «Название», «Суть», «Применимость к
    задаче» (без двоеточия — как подпись поля, не как метка чтения),
    «Следующий шаг» (то же), «Риски (по одному на строку)», «Как выйти на
    связь (по одному на строку)», «Организация-разработчик», «Команда
    разработчика».

    Управляющие элементы: «Убрать подтверждение из карточки:» (подпись у
    списка чекбоксов удаления evidence), «Править карточку» (заголовок
    сворачиваемого блока правки, <details><summary>), «Сохранить правки»
    (текст кнопки отправки формы).

    Ссылка на PDF: «Полный текст (PDF)» — в markdown было «Полный текст:
    [PDF](url)», здесь текст ссылки объединён в одну фразу без отдельного
    слова перед скобкой.

    Решения по границам задачи: POST /cards/{card_id}/edit возвращает
    RedirectResponse (303) на GET-страницу отчёта того же запроса — простой
    паттерн post-redirect-get без HTMX, укладывается в контракт волны (HTMX
    здесь не требовался явно, инлайновый style= не заводился, hex-цветов нет).
    Плашка «отчёт ещё не готов» на случай отсутствия report_json — за рамками
    девяти обязательных критериев, добавлена для отказоустойчивости страницы
    (не 500, а понятная страница), тестом покрыта частично (test_unknown_request_returns_404
    проверяет отсутствие самой строки requests; случай «строка есть, report_json
    пуст» уже проверяется существующим ReportNotFoundError в persistence.py,
    отдельного теста на него в этом файле нет — граница между «сделано» и
    «страховка сверх критериев»). theme.css не тронут — все нужные классы уже
    были заведены задачей И-8 (.draft-banner, .notice.danger, .table-wrap,
    .compare-table, .card-edit, .maturity, .badge/.badge.low); нехватки классов
    не обнаружено, эскалации к И-13 нет.
