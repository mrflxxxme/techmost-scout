  notes: |
    +1 вызов модели на прогон (стадия dedup_judge, маршрут dedup_judge:deepseek,
    max_tokens=6000). Живой прогон пробы (~0,1–0,3 ₽ по оценке PLAN.md) НЕ
    делал — это работа оркестратора (инвариант №7 для агента, явно оговорено
    в постановке). Живого вызова судьи в проде тоже не делал: только
    FakeProvider в тестах.

    Дизайн-развилка, которую стоит явно проговорить на ревью: судья видит
    `selected` (кандидатов ДО group_for_cards, как в постановке Д-6 «перед
    группировкой»), но подключение в run_stages.py вызывает
    group_for_cards() ПЕРВЫМ, а вердикт судьи применяется к его результату
    через apply_judge_groups (union-find по личности кандидата) — а не
    заменяет org-группировку целиком. Причина: буквальная замена (судья
    решает ВСЁ, group_for_cards не вызывается) технически возможна, но я не
    нашёл в постановке однозначного требования отказаться от
    org-группировки, а объединение обоих сигналов (организация ИЛИ судья)
    строго не хуже (уравнение "хотя бы один сигнал — дубль"), не теряет
    покрытие merge_duplicate_groups и не требует трогать selection.py
    (граница задачи: "скоринг/отбор не менять"). Если ревью сочтёт нужным
    буквальную замену — это локальная правка внутри run_stages.py, тесты
    apply_judge_groups не изменятся.

    StageRecord "dedup_judge" появляется в журнале ТОЛЬКО когда вызов
    реально произошёл (len(selected)>=2) — по тому же принципу, что и
    строка contest_cards чуть ниже по файлу ("своя строка только когда
    была причина её писать"). Это осознанный выбор: альтернатива (всегда
    писать строку, включая "пропущено, кандидатов меньше двух") разошлась
    бы с этим прецедентом и добавила бы вторую форму той же информации.

    Файлы, тронутые за пределами исходного списка задачи (все —
    консеквенциальные, не по инициативе): tests/test_pipeline_second_pass.py
    и tests/test_contest_gate_and_order.py — оба уже перечислены в did/
    artifacts выше с точным объяснением, почему и где именно.

