    JUDGE_MAX_GROUP_SIZE, деградация безопасна, но само число не доказывало
    качество промпта на боевом составе полей). Ревьюер нашёл код-причину:
    scripts/dedup_judge_probe.py::to_candidates строил Candidate с org=None,
    snippet="" — беднее, чем боевая _listing(), которая всегда показывает
    судье реальные org/snippet кандидата. Правка: org/snippet взяты из тех
    же воротных отчётов, откуда пришли заголовки (evidence/E2V-gate-фарма.md,
    evidence/E2B-gate-нефтегаз.md) — по прямому указанию ревью, честно, без
    выдумывания там, где карточка сама пишет «не найдено». ПРОМПТ НЕ
    ПРАВИЛ — оба совета ревью (правило про организацию, калибровка правила 6)
    ждут чисел повторного живого прогона, чтобы не подгонять промпт и пробу
