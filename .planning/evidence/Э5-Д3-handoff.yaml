cycle_2:
  review_commit: "444541f"
  verdict_received: "ВЕРНУТЬ (1 блокирующая, 3 совета)"
  fixed:
    - "Блокирующая: docker volume ls | grep scout не находил старые тома
      docker_caddy-data и docker_caddy-config (нет подстроки scout в имени),
      хотя текст рядом обещал, что фильтр покажет 'похожую пару' и для
      Caddy. Заменено на grep -E \"scout|caddy\" в обоих местах (§8 и §10) с
      альтернативой без фильтра вовсе (томов пять, список короткий). Явно
      написано, почему прежний фильтр был неверен."
    - "Совет 1: шаг chown -R scout:scout ограничен только scout-data и
      scout-out (тома сервиса scout, uid 10001); для caddy-data/caddy-config
      явно написано, что шаг не нужен и упадёт (caddy:2-alpine — root, без
      пользователя scout); для scout-backups — том и так root, сайдкар
      backup под user: \"0:0\"."
    - "Совет 2: том-источник в примере переноса смонтирован :ro
      (-v docker_scout-data:/from:ro) — страховка от опечатки в направлении
      копирования."
    - "Совет 3: добавлена явная пометка в docs/deploy.md (не только в
      handoff), что перенос том-в-том через одноразовый контейнер никто не
      прогонял на реальном Docker и стоит проверить на тестовом стенде
      перед боевым применением."
  checks:
    - "pytest -q: 1293 passed, 1 warning (та же сторонняя StarletteDeprecationWarning)"
    - "ruff check .: All checks passed!"
    - "ruff format --check .: 211 files already formatted"
    - "printf со всеми 10 именами томов (5 старых docker_*, 5 новых
      techmost-scout_*) | grep -E \"scout|caddy\" → все 10 строк совпали
      (прежний grep scout ловил только 3 из 5 старых); вывод в
      .planning/evidence/Э5-Д3-grep.txt, раздел 'проверка: новый фильтр
      ловит все пять старых и все пять новых имён томов'"
  artifacts:
    - docs/deploy.md
    - .planning/evidence/Э5-Д3-grep.txt
