    4 теста пришлось поправить, иначе `pytest -q` не был бы зелёным после
    корректной реализации задачи. Правка минимальна и по существу совпадает
    с правкой аналогичных тестов в моих собственных *_field_gate.py файлах:
    в pdf-файле (запас до 500 строк был) — добавлены comparison_rows и
    правильная заглушка с новым импортом; в docx-файле (ровно 500/500,
