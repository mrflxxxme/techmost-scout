    строки, docstring не тронут, wc -l не изменился (проверено). Отмечаю
    здесь явно, а не молчу — это ровно тот случай, когда инструкция «файла
    не трогать» и требование «pytest -q зелёный» разошлись, и я выбрал
    видимую, минимальную правку вместо тихого расширения скоупа или тихого
    оставления кода с падающими тестами.

    Второй момент за границами: в review.py уже живёт своя копия признака
    видимости — _hidden_reason (reject или пустой evidence, для подсказки
    эксперту на экране ревью, кто из карточек не уедет клиенту и почему).
    Это третье место расчёта того же условия, но экран ревью прямо исключён
    из списка моих файлов («операторская страница не меняется» — общая
    формулировка постановки покрывает оба операторских экрана), и его вывод
    (номер карточки у клиента + причина скрытия текстом) — другая форма
    данных, не Report. Не трогал, оставил оркестратору на заметку — если
    когда-нибудь понадобится единая точка, это второй кандидат на слияние с
    verdicts._kept_positions.

    Живых вызовов моделей и платных источников не делал — вся работа на
    фикстурах, временных SQLite-базах и подменённых страницах Chromium (в
    существующих тестах PrintPage уже была заглушкой, я её не трогал).
    Копия боевой базы (data/scout.db) лежала в scratchpad и туда же
    удалялась вместе с прогоном — исходный файл не редактировался ни разу.
