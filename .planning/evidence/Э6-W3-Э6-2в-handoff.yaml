  autonomous_decisions:
    - "1. Правка yandex_search.py вне перечня файлов задачи. Без неё пачки невозможны: счётчик платных запросов и limit_problems живут в адаптере, а with_site_filter чистая функция, возвращающая одну строку. Правка локальна: ветка в search_raw и метод _search_analog (+45 строк, файл 373). Если ворота против — альтернатива только в виде одной пачки (≈18 доменов из 27), остальные домены не опрашиваются."
    - "2. Предел длины 400 символов взят из схемы Yandex Search API (поле query_text, length <=400, search_query.proto в yandex-cloud/cloudapi). Страницы справки yandex.cloud/ru/docs/search-api отдают роботу капчу, обходить её не стал; URL схемы и справки — в комментарии константы. Предел считается в символах всей формулировки; ограничение справки по числу слов (по памяти 40) не проверено и не заложено."
    - "3. Порядок пачек: каталоги YC и Product Hunt первыми, затем отчёты в порядке файла — при нехватке платных запросов в предел влезают каталоги (РЕШ-255, 256)."
    - "4. Отказ (SearchError) на любой пачке поднимается наружу целиком, уже полученное по ранним пачкам теряется: частичный успех с проглоченным отказом нарушил бы инв. 5. Альтернатива (оставить кандидатов и дописать отказ в limit_problems) — на выбор ворот."
    - "5. Формулировка analog, которой не хватает места даже под один site:, не отправляется; все домены называются в limit_problems. with_site_filter в этом случае поднимает ValueError (адаптер до него не доходит)."
    - "6. Загрузчик игнорирует чужие секции файла (под ru_registries Э6-8) и требует непустые reports и catalogs, kind — непустая строка без закрытого перечня, чтобы новый вид добавлялся правкой YAML. Проверка повторов — по сумме reports и catalogs; Э6-8 вправе проверять ru_registries отдельно."
    - "7. Формат site: прежний (`текст (site:a | site:b)`), единый для грантов, конкурсов и аналогов через narrow_text."
