      backend/app/web/templates/base.html печатает пункт «API» только при
      непустом api_docs_url и берёт адрес из него, а не из зашитой строки.
    - >-
      Новый tests/test_web_api_schema.py (9 тестов): unit на schema_urls
      (dev/test открыто; prod/PROD/"" закрыто), поведенческий тест на
      реальном FastAPI-приложении (404 при prod, 200 при dev — обе половины),
