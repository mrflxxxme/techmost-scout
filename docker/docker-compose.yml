# Боевая связка: приложение + Caddy (HTTPS и вход по паролю) + сайдкар копии базы.
# Секреты приходят из .env рядом с этим файлом; в репозиторий он не идёт
# (docker/.env создаётся владельцем на сервере из .env.example).
#
# env_file остаётся обязательным для scout: без .env приложение поднимется на
# небезопасном умолчании пароля веб-интерфейса, и отсутствие секретов станет
# тихим вместо громкого. Ослаблять требование к файлу окружения запрещено.

# Имя проекта фиксировано: без него compose берёт имя из каталога развёртывания
# (обычно "docker"), и контейнеры выходят "docker-scout-1" вместо предсказуемых
# "techmost-scout-scout-1" — путаница на сервере с несколькими проектами рядом.
name: techmost-scout

services:
  scout:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Явный тег даёт сервису backup общий с приложением образ (см. ниже) без
    # второй сборки: docker compose build собирает только сервисы с ключом
    # build, а backup просто ссылается на уже собранный тег по имени.
    image: techmost-scout-app:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - scout-data:/srv/scout/data
      - scout-out:/srv/scout/out
    expose:
      - "8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      scout:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Сайдкар копии базы (РЕШ-223, уточнено РЕШ-229). Изначальный план требовал
  # базовый образ alpine с установкой пакета sqlite при каждом старте — цена
  # этого варианта: сеть на старте и на каждом перезапуске, а копия базы
  # обязана быть самым надёжным элементом связки, а не самым хрупким. Поэтому
  # сайдкар поднимается из того же образа, что и приложение (общие слои, без
  # второй сборки), и делает копию sqlite3.Connection.backup() из стандартной
  # библиотеки Python — ни сети, ни установки пакетов.
  backup:
    image: techmost-scout-app:local
    # У сайдкара нет своего build: тег появляется только сборкой scout, и без
    # этой директивы compose при первом запуске штатно пытается сначала
    # стянуть "techmost-scout-app:local" из реестра — тега там нет и не будет.
    pull_policy: never
    restart: unless-stopped
    # На чистом развёртывании тома пустые и файла базы ещё нет: без ожидания
    # сайдкар стартует одновременно с приложением, первая попытка копии
    # проваливается на "unable to open database file", и цикл уходит в сутки
    # ожидания следующей попытки. service_healthy у scout гарантирует, что
    # init_db() уже отработал в lifespan (backend/app/main.py) — файл базы
    # существует до первого прохода сайдкара.
    depends_on:
      scout:
        condition: service_healthy
    # Именованный том создаётся принадлежащим root, и процесс приложения
    # (uid 10001, см. Dockerfile) писать в него не смог бы. Это не отменяет
    # правило "приложение не от root" — оно про сервис scout, а не про сайдкар.
    user: "0:0"
    # HEALTHCHECK образа опрашивает /health, а веб-сервера в сайдкаре нет:
    # без отключения `docker compose ps` вечно показывает backup unhealthy.
    healthcheck:
      disable: true
    volumes:
      # Только чтение: копия не должна иметь возможность повредить рабочую базу.
      - scout-data:/data:ro
      # Отдельный том — копия на том же томе, что и база, не переживает
      # повреждение этого тома.
      - scout-backups:/backups
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - python3
      - "-c"
      - |
        import glob
        import os
        import sqlite3
        import sys
        import time
        from datetime import datetime, timezone

        DAY = 86400
        RETENTION_DAYS = 14
        # Предел ожидания снятия блокировки источника. Без него удерживаемая
        # эксклюзивная транзакция вешает проход навсегда: контейнер остаётся
        # "running", в журнале пусто, копий нет — тихий пропуск отказа.
        LOCK_WAIT_TIMEOUT_SECONDS = 30

        while True:
            stamp = datetime.now(timezone.utc).strftime("%Y%m%d-%H%M%S")
            dest = f"/backups/scout-{stamp}.db"
            # Копия пишется во временное имя и переименовывается только после
            # успеха: иначе обрыв на середине оставляет "scout-<дата>.db"
            # нулевого размера — файл с именем годной копии, но пустой.
            tmp_dest = f"{dest}.part"
            src = None
            dst = None
            try:
                start = time.monotonic()

                def _abort_if_too_slow(status, remaining, total):
                    elapsed = time.monotonic() - start
                    if elapsed > LOCK_WAIT_TIMEOUT_SECONDS:
                        raise TimeoutError(
                            f"источник не снял блокировку за {LOCK_WAIT_TIMEOUT_SECONDS} с"
                        )

                # timeout=1 сокращает внутренний шаг ожидания блокировки у
                # sqlite3 (умолчание 5 с) — иначе первая же проверка предела
                # выше сработает с опозданием на целый внутренний интервал.
                src = sqlite3.connect("file:/data/scout.db?mode=ro", uri=True, timeout=1)
                dst = sqlite3.connect(tmp_dest, timeout=1)
                with dst:
                    src.backup(dst, pages=1, progress=_abort_if_too_slow)
                os.rename(tmp_dest, dest)
            except Exception as exc:  # отказ виден, цикл не прерывается
                print(f"копия базы не выполнена: {exc}", file=sys.stderr)
                if os.path.exists(tmp_dest):
                    try:
                        os.remove(tmp_dest)
                    except OSError:
                        pass
            finally:
                if dst is not None:
                    dst.close()
                if src is not None:
                    src.close()

            cutoff = time.time() - RETENTION_DAYS * DAY
            # Второй шаблон — огрызки "*.db.part": при жёстком убийстве
            # контейнера между записью временного файла и его переименованием
            # (см. os.rename выше) огрызок не попадает под первый шаблон и
            # без этой строки остался бы в томе навсегда.
            candidates = glob.glob("/backups/scout-*.db") + glob.glob("/backups/scout-*.db.part")
            for path in candidates:
                try:
                    if os.path.getmtime(path) < cutoff:
                        os.remove(path)
                except OSError as exc:
                    print(f"ротация копии не выполнена: {exc}", file=sys.stderr)

            time.sleep(DAY)

volumes:
  scout-data:
  scout-out:
  caddy-data:
  caddy-config:
  scout-backups:
