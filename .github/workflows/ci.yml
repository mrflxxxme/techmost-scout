# Проверка на Linux: тесты и линтер. Сети в тестах нет (инвариант №7),
# поэтому ключи и секреты здесь не нужны. Браузер Playwright не ставится:
# печать PDF живьём проверяется на сервере, тесты её подменяют.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Зависимости
        # ruff закреплён на версии проекта (РЕШ-234): другая версия форматирует иначе
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,export]" "ruff==0.16.4"
      - name: Линтер
        run: |
          ruff check .
          ruff format --check .
      - name: Тесты
        run: pytest -q
