# Справочник «отрасль брифа → набор (set) OAI-PMH КиберЛенинки».
#
# Зачем он нужен. OAI-PMH не умеет полнотекстовый поиск: есть только «выдай
# записи» с фильтром по набору. За один вызов адаптер просматривает окно в 30
# записей из ~2 млн, и без осмысленного набора это 30 случайных записей —
# именно отсюда нулевая выдача источника на живых прогонах. Набор сужает окно
# до предметной области, и попадание становится возможным.
#
# Наборы взяты из ListSets репозитория (их около 3930): предметные — cas,
# agris, medline/pubmed, georef; rsci — не предметный, а признак уровня
# издания, поэтому он здесь только запасной.
#
# Как работает сопоставление (backend/app/search/cyberleninka.py):
#   * отрасль приводится к сравнимому виду — нижний регистр, «ё» → «е»,
#     знаки препинания в пробелы;
#   * приметы (keywords) — обрезанные основы, чтобы русская морфология не
#     мешала: «агропром» ловит «агропромышленный комплекс»;
#   * порядок записей значимый — выигрывает первая подошедшая. Поэтому
#     «нефтегазодобыча» уходит в cas (химия и переработка), а не в georef:
#     у georef приметы намеренно узкие, про недра и горное дело.
#   * ни одна примета не подошла — берётся набор из настройки
#     CYBERLENINKA_OAI_SET, а если и она пуста — fallback отсюда.
#
# Файл обязан оставаться корректным YAML: все значения — в кавычках
# (инвариант №10, грабля §0.1 п. 5 — двоеточие в незакавыченном значении
# ломает разбор). Проверяется тестом tests/test_search_cyberleninka.py.
#
# Последняя сверка наборов с живым ListSets: 12 августа 2026.

fallback: "rsci"

sets:
  - set: "agris"
    name: "AGRIS: сельское хозяйство, агротехнологии, пищевая промышленность"
    keywords:
      - "агропром"
      - "агротех"
      - "агроном"
      - "сельск"
      - "сельхоз"
      - "пищев"
      - "животновод"
      - "растениевод"
      - "ветеринар"

  - set: "cas"
    name: "Chemical Abstracts: химия, нефтехимия, переработка, катализ"
    keywords:
      - "хими"
      - "нефт"
      - "газоперераб"
      - "катализ"
      - "полимер"
      - "лакокрасоч"
      - "удобрени"

  - set: "medline"
    name: "MEDLINE: медицина и фармацевтика; родственный набор — pubmed"
    keywords:
      - "фарм"
      - "медицин"
      - "лекарств"
      - "здравоохран"
      - "клинич"
      - "биомед"

  - set: "georef"
    name: "GeoRef: геология, горное дело, недропользование"
    keywords:
      - "геолог"
      - "горное дело"
      - "горнодобыв"
      - "недропольз"
      - "полезных ископаемых"
      - "маркшейдер"
      - "рудник"
      - "шахт"
