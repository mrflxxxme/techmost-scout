# Справочник инструментов господдержки НИОКР.
#
# Подаётся модели как контекст на стадии сборки карточки. Модель обязана
# выбирать инструменты ТОЛЬКО отсюда и только если формально подходят условия —
# выдумывать инструменты и суммы запрещено.
#
# Проверять актуальность раз в квартал: суммы и условия меняются.
# Последняя сверка: 9 августа 2026.
#
# Файл обязан оставаться корректным YAML: значения с двоеточием внутри берите в
# кавычки. Это проверяется тестом tests/test_prompts.py.

instruments:
  - name: Постановление Правительства № 218
    what: Субсидия промышленному заказчику на исследования, выполняемые вузом или научной организацией
    limit: до 70% стоимости работ
    applies_when:
      - Заказчик — производственная компания, исполнитель — вуз или научная организация
      - Результат внедряется в собственное производство заказчика
      - Есть софинансирование со стороны заказчика
    not_for:
      - Закупка готового оборудования без исследовательской части
    url: https://pp218.ru/about/
    note: Конкурсный отбор, заявочные волны. Требует оформленного техзадания на НИОКР.

  - name: Двойной вычет по налогу на прибыль (коэффициент 2)
    what: Затраты на исследования и разработки уменшают базу налога на прибыль с коэффициентом 2
    limit: без ограничения суммы, по перечню Правительства
    applies_when:
      - Работы относятся к НИОКР по перечню Правительства РФ
      - Заказчик на общей системе налогообложения
    not_for:
      - Компании на упрощённой системе
    url: https://www.consultant.ru/law/hotdocs/86833.html
    note: >
      При ставке налога 25% экономия ощутима. Малые технологические компании
      применяют коэффициент 2 и вне перечня. Инструментом пользуются мало:
      по словам министра экономического развития — порядка 60 компаний в стране.

  - name: Грант на доращивание технологии
    what: Софинансирование доработки технологии под запрос конкретного крупного заказчика
    limit: до 250 млн рублей
    applies_when:
      - Есть квалифицированный заказчик, подтвердивший потребность
      - Технология требует доработки до промышленной применимости
      - Разработчик — малая технологическая компания
    not_for:
      - Фундаментальные исследования без заказчика
    url: https://inno-sc.ru/
    note: "Ровно наш сценарий: закрывает разрыв между лабораторией и заводом."

  - name: Специальный инвестиционный контракт (СПИК 2.0)
    what: Налоговые льготы и стабилизационная оговорка за внедрение технологии из перечня
    limit: срок до 15–20 лет в зависимости от объёма инвестиций
    applies_when:
      - Внедряется технология из перечня современных технологий
      - Объём инвестиций значительный, проект долгосрочный
    not_for:
      - Небольшие проекты модернизации
    url: https://gisp.gov.ru/nmp/measure/10511015
    note: Тяжёлый инструмент, имеет смысл при крупном проекте.

  - name: Гранты Фонда содействия инновациям
    what: Поддержка малых инновационных предприятий на разных стадиях
    limit: от 3 до 30 млн рублей в зависимости от программы
    applies_when:
      - Исполнитель — малое инновационное предприятие
      - Есть научно-техническая новизна
    not_for:
      - Крупные компании
    url: https://fasie.ru/
    note: Подходит, когда разработчик — небольшая команда при институте.
