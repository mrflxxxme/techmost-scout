[project]
name = "techmost-scout"
version = "0.1.0"
description = "Подбор научно-технических решений под задачу бизнеса"
requires-python = ">=3.12"
authors = [{ name = "Кирилл Уклонский", email = "uklonskiy.k@gmail.com" }]

dependencies = [
    # Веб и шаблоны: один процесс отдаёт и API, и страницы
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",  # разбор форм
    # Данные и настройки
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Приезжает транзитивно с pydantic, но импортируется у нас напрямую
    # (`MaxLen` в `pipeline/stages.py`): прямой импорт объявляется прямой
    # зависимостью, иначе смена внутренностей pydantic ломает нас молча.
    "annotated-types>=0.6",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    # Сеть
    "httpx>=0.27",
    # Разбор XML из сети (arXiv, OAI-PMH КиберЛенинки): защита от вредоносных
    # конструкций вроде «миллиарда смешков», которые валят стандартный парсер
    "defusedxml>=0.7",
    # Командная строка
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
# Выгрузка в клиентские форматы — этап 4. Ставится отдельно, чтобы базовая
# установка оставалась лёгкой и быстрой.
export = [
    "python-docx>=1.1",
    "playwright>=1.48",  # печать PDF через headless-браузер
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",  # подмена HTTP-ответов в тестах, без обращения к сети
    "ruff>=0.8",
]

[project.scripts]
scout = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["backend"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["backend", "tests"]
# ruff форматирует питоновские блоки внутри markdown. В .planning/ лежат план,
# решения и доказательства — проза с примерами кода, которую переформатировать
# нельзя: доказательство обязано совпадать с тем, что было фактически выведено.
# Без этого исключения `ruff format --check .` падает на отчёте проверяющего и
# валит критерий приёмки любой задачи (DLG-1 верификации Т-2).
extend-exclude = [".planning"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",   # assert в тестах — норма
    "RUF001", # кириллица рядом с латиницей в строках — у нас так по всему проекту
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # тестовые пароли-заглушки
# Depends(...) и typer.Option(...) в значениях по умолчанию — идиома этих
# библиотек, а не ошибка: так объявляются зависимости и параметры команд.
"backend/app/web/routes.py" = ["B008"]
"backend/app/main.py" = ["B008"]
"backend/app/cli.py" = ["B008"]
